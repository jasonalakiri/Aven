<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aven - Coding streaks</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
    <h1>Aven</h1>
    <p class="tagline">Become the developer who shows up.</p>
    <p class="description">A consistency tracker for people learning to code.</p>
    <p id="challengeName">No challenge yet</p>
    <p class="progressLine"><span id="progressText">Day 0 of 0</span> <span id="progressPct">0%</span></p>
    <div id="progressBar"><div id="progressFill"></div></div>
</header>

    <nav id="tabs">
        <button type="button" data-tab="today">Today</button>
        <button type="button" data-tab="progress">Progress</button>
        <button type="button" data-tab="history">History</button>
    </nav>

    <section data-panel="today">
        <h2>Today</h2>
    <!-- Recovery message: hidden until session S19 -->
    <div id="recoveryBox" hidden></div>

    <form id="logForm">
        <fieldset>
            <legend>What did you do?</legend>

            <input type="radio" id="typeLearned" name="type" value="learned" required>
            <label for="typeLearned">Learned</label>

            <input type="radio" id="typeBuilt" name="type" value="built">
            <label for="typeBuilt">Built</label>

            <input type="radio" id="typeReviewed" name="type" value="reviewed">
            <label for="typeReviewed">Reviewed</label>
        </fieldset>

        <div>
            <label for="minutes">Minutes</label>
            <input type="number" id="minutes" name="minutes"
                   min="1" max="1440" step="1" inputmode="numeric"
                   placeholder="e.g. 30" required>
        </div>

        <div>
            <label for="note">Note (optional)</label>
            <textarea id="note" name="note" rows="3" maxlength="280"
                      placeholder="What did you learn or build?"></textarea>
        </div>

        <button type="submit" id="logButton">Log Today</button>
        <p id="formMessage" aria-live="polite"></p>
    </form>
</section>

    <section data-panel="progress">
      <h2>Progress</h2>
      <div class="statGrid">
    <div class="card">
        <p>Challenge day</p>
        <p id="statDay" class="statValue">0</p>
    </div>
    <div class="card">
        <p>Days completed</p>
        <p id="statCompleted" class="statValue">0</p>
    </div>
    <div class="card">
        <p>Current streak</p>
        <p id="statStreak" class="statValue">0</p>
    </div>
    <div class="card">
        <p>Longest streak</p>
        <p id="statLongest" class="statValue">0</p>
    </div>
</div>
        <p>Challenge completion: <span id="statPct">0%</span></p>
        <h3>This week</h3>
    </section>


    <section data-panel="history">
        <h2>History</h2>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
<input type="radio" id="typeLearned" name="type" value="learned" required>
<label for="typeLearned">Learned</label>
